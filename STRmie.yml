name: STRmie
channels:
  - defaults
  - conda-forge
  - bioconda
dependencies:
  - python>=3.8
  - numpy
  - pandas
  - scikit-learn
  - matplotlib
  - h5py
  - joblib
  - jinja2
  - biopython
  - seaborn
  - colorama
  - openpyxl
  - xlrd
  - scipy
  - pytest
  - regex
  - pear  # optional, only needed for --merge_paired_end
